<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MusicGuessr · 每日挑战 · 猜歌游戏</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#150a24;
    --bg-deep-2:#1a0e2b;
    --bg-card:#2a1743;
    --bg-card-2:#341d54;
    --gold-1:#f8dfa0;
    --gold-2:#d9a441;
    --gold-3:#a5701e;
    --pink:#ff7fb0;
    --pink-dim:#c9578f;
    --success:#6ee7b7;
    --fail:#9a91a8;
    --text-light:#f6f0ff;
    --text-dim:#b4a3d4;
    --text-faint:#7c6b9c;
    --radius-lg:28px;
    --radius-md:20px;
    --radius-sm:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:
      radial-gradient(circle at 20% -10%, #3a2159 0%, transparent 45%),
      radial-gradient(circle at 100% 10%, #2c1848 0%, transparent 50%),
      var(--bg-deep);
    color:var(--text-light);
    font-family:'Noto Sans SC', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }
  .display-font{font-family:'ZCOOL KuaiLe', 'Noto Sans SC', sans-serif;}
  button{font-family:inherit; border:none; cursor:pointer; background:none; color:inherit;}
  input{font-family:inherit;}

  /* ---------- app shell ---------- */
  #app{
    width:100%;
    max-width:480px;
    min-height:100dvh;
    position:relative;
    background:linear-gradient(180deg, var(--bg-deep-2) 0%, var(--bg-deep) 100%);
    box-shadow:0 0 60px rgba(0,0,0,0.5);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  /* ---------- site header (logo + name, top-left, all screens) ---------- */
  .site-header{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:8px;
    padding:14px 16px 6px 16px;
  }
  .site-header .site-logo{
    width:26px; height:26px; flex-shrink:0;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,0.35));
  }
  .site-header .site-name{
    font-size:17px;
    letter-spacing:0.5px;
    color:var(--gold-1);
    font-weight:700;
    font-family:'Noto Sans SC', sans-serif;
  }

  /* ---------- screens wrapper (holds all absolutely-positioned screens) ---------- */
  .screens-wrap{
    position:relative;
    flex:1;
    min-height:0;
  }

  /* ---------- header / score bar (per-screen) ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 18px 8px 18px;
  }
  .topbar .back-btn{
    width:38px; height:38px; border-radius:50%;
    background:rgba(255,255,255,0.06);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; color:var(--text-dim);
  }
  .topbar .back-btn.hidden{visibility:hidden;}
  .score-pill{
    display:flex; align-items:center; gap:6px;
    background:linear-gradient(135deg, #3a2456, #2a1743);
    border:1px solid rgba(248,223,160,0.25);
    padding:7px 14px 7px 10px;
    border-radius:999px;
    box-shadow:0 4px 14px rgba(0,0,0,0.35);
  }
  .score-pill .star{font-size:16px; filter:drop-shadow(0 0 4px rgba(248,223,160,0.7));}
  .score-pill .score-num{font-weight:700; font-size:15px; color:var(--gold-1); letter-spacing:0.5px;}

  /* ---------- screens ---------- */
  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    opacity:0; pointer-events:none;
    transform:translateY(8px);
    transition:opacity .45s ease, transform .45s ease;
    /* 仍然保留可滚动（内容超出时不会被裁掉看不到），
       但把滚动条本身的视觉样式隐藏掉——三行分别对应
       Firefox / 旧版 IE-Edge / Chrome-Safari-移动端浏览器 */
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .screen::-webkit-scrollbar{
    display:none;
    width:0;
    height:0;
  }
  .screen.active{
    position:relative;
    opacity:1; pointer-events:auto; transform:translateY(0);
  }

  /* portal transition overlay：唱片在音乐盒上旋转的加载动画 */
  #portal-overlay{
    position:fixed; inset:0; z-index:200;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle, #6b3fa0 0%, #1a0e2b 70%);
    opacity:0; pointer-events:none;
  }
  #portal-overlay.show{ animation:portalPulse 1.05s ease forwards; }
  @keyframes portalPulse{
    0%{opacity:0; clip-path:circle(0% at 50% 20%);}
    30%{opacity:1; clip-path:circle(75% at 50% 20%);}
    70%{opacity:1; clip-path:circle(75% at 50% 20%);}
    100%{opacity:0; clip-path:circle(140% at 50% 20%);}
  }
  .record-loader{
    position:relative;
    width:100px; height:126px;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .record-box{
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:76px; height:36px;
    border-radius:10px 10px 6px 6px;
    background:linear-gradient(160deg, var(--gold-1), var(--gold-2) 60%, var(--gold-3));
    box-shadow:0 8px 20px rgba(0,0,0,0.45), inset 0 2px 4px rgba(255,255,255,0.45);
  }
  .record-box::before{
    content:"";
    position:absolute; left:50%; top:-4px; transform:translateX(-50%);
    width:54px; height:7px; border-radius:4px;
    background:rgba(21,10,36,0.55);
  }
  .record-disc{
    width:90px; height:90px;
    position:relative; z-index:2;
    margin-bottom:-8px; /* 让唱片略微叠在音乐盒转盘上 */
    filter:drop-shadow(0 10px 16px rgba(0,0,0,0.5));
    animation:recordSpin 0.85s linear infinite;
  }
  @keyframes recordSpin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

  /* ---------- HOME ---------- */
  .home-banner{
    margin:6px 16px 18px 16px;
    padding:28px 22px 24px 22px;
    border-radius:var(--radius-lg);
    background:
      radial-gradient(circle at 90% 0%, rgba(255,127,176,0.35), transparent 55%),
      linear-gradient(135deg, #4b2a72 0%, #2a1743 70%);
    position:relative;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    cursor:pointer;
    transition:transform .15s ease;
  }
  .home-banner:active{ transform:scale(0.98); }
  .home-banner::after{
    content:"";
    position:absolute; right:-30px; top:-30px;
    width:140px; height:140px; border-radius:50%;
    background:radial-gradient(circle, rgba(248,223,160,0.35), transparent 70%);
  }
  .home-banner h1{
    margin:0; font-size:34px; font-weight:400;
    color:var(--gold-1);
    letter-spacing:2px;
    text-shadow:0 3px 12px rgba(0,0,0,0.5);
  }
  .home-banner p{
    margin:8px 0 0 0; font-size:13.5px; color:var(--text-dim); letter-spacing:1px;
  }
  .home-banner .daily-last-score{
    margin-top:12px;
    font-size:12.5px; font-weight:700;
    color:var(--gold-1);
    background:rgba(248,223,160,0.14);
    border:1px solid rgba(248,223,160,0.3);
    display:inline-block;
    padding:5px 12px;
    border-radius:999px;
    position:relative; z-index:1;
  }
  .home-banner .banner-cta{
    display:inline-block; margin-top:14px; font-size:12px; color:var(--gold-1);
    background:rgba(248,223,160,0.14); border:1px solid rgba(248,223,160,0.35);
    padding:6px 14px; border-radius:999px; position:relative; z-index:1;
  }

  .mode-grid{
    display:grid; grid-template-columns:1fr 1fr;
    gap:14px; padding:0 16px;
  }
  .mode-card{
    aspect-ratio:1/0.95;
    border-radius:var(--radius-md);
    padding:16px;
    display:flex; flex-direction:column; justify-content:space-between;
    position:relative; overflow:hidden;
    transition:transform .15s ease;
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
  }
  .mode-card:active{ transform:scale(0.96); }
  .mode-card .emoji{font-size:34px;}
  .mode-card .title{font-size:17px; font-weight:700;}
  .mode-card .sub{font-size:11.5px; color:rgba(255,255,255,0.65); margin-top:2px;}

  .mode-card.normal{ background:linear-gradient(150deg,#3d2560,#26173e); }
  .mode-card.kpop{ background:linear-gradient(150deg,#5c2456,#301a45); }
  .mode-card.western{ background:linear-gradient(150deg,#24406b,#1c2a49); }
  .mode-card.locked{
    background:#26203a; color:rgba(255,255,255,0.35);
    display:flex; align-items:center; justify-content:center; text-align:center;
    cursor:not-allowed;
  }
  .mode-card.locked .lock-emoji{font-size:26px; margin-bottom:6px;}
  .mode-card.locked .title{font-size:14px; color:rgba(255,255,255,0.4);}

  /* ---------- ZODIAC SELECT ---------- */
  .zodiac-header{ padding:4px 20px 0 20px; }
  .zodiac-header h2{ margin:0; font-size:22px; color:var(--gold-1); font-weight:400; }
  .zodiac-header p{ margin:6px 0 0 0; font-size:12.5px; color:var(--text-faint); }
  /* 显眼的游戏规则说明，放在选生肖页面最上方 */
  .zodiac-rule-banner{
    margin:10px 20px 0 20px;
    padding:9px 14px;
    border-radius:14px;
    background:rgba(248,223,160,0.1);
    border:1px solid rgba(248,223,160,0.3);
    color:var(--gold-1);
    font-size:12.5px;
    font-weight:700;
    text-align:center;
    line-height:1.5;
  }

  .zodiac-grid{
    flex:1;
    display:grid; grid-template-columns:repeat(3, 1fr);
    gap:14px; padding:20px; align-content:start;
  }
  .zodiac-cell{
    aspect-ratio:1/1;
    border-radius:var(--radius-sm);
    background:linear-gradient(160deg, var(--bg-card-2), var(--bg-card));
    border:1px solid rgba(255,255,255,0.06);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px;
    perspective:600px;
  }
  .zodiac-cell .flip-inner{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px; transition:transform .5s ease;
  }
  .zodiac-cell .emoji{font-size:30px;}
  .zodiac-cell .name{font-size:11.5px; color:var(--text-dim);}
  .zodiac-cell .door-number-badge{
    font-family:'ZCOOL KuaiLe', sans-serif;
    font-size:26px;
    font-weight:700;
    letter-spacing:1px;
  }
  .zodiac-cell.solved{
    background:linear-gradient(160deg, #2a3d33, #1e2c25);
    opacity:0.55;
  }
  .zodiac-cell.solved .emoji{ filter:grayscale(1); }
  .zodiac-cell.solved::after{
    content:"✓"; position:absolute; font-size:20px; color:var(--success);
    margin-top:-52px;
  }
  .zodiac-cell:not(.solved):active{ transform:scale(0.94); }

  /* ---------- DOOR SCREEN ---------- */
  .door-screen{ align-items:center; padding:10px 24px 30px 24px; text-align:center; }
  .door-number-wrap{ margin-top:10px; }
  .door-label{ font-size:13px; letter-spacing:3px; color:var(--text-faint); }
  .door-number{
    font-size:96px; line-height:1; font-weight:400;
    background:linear-gradient(180deg, var(--gold-1), var(--gold-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 6px 30px rgba(217,164,65,0.25);
    margin:2px 0 6px 0;
  }
  .door-score-hint{ font-size:12.5px; color:var(--text-dim); margin-bottom:22px; }

  .doorbell-wrap{ position:relative; margin:10px 0 26px 0; }

  /* -- 门铃按钮：呼吸 + 发光特效 -- */
  .doorbell-btn{
    position:relative;
    z-index:2;
    width:150px; height:150px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-1), var(--gold-2) 55%, var(--gold-3) 100%);
    box-shadow:0 0 0 8px rgba(248,223,160,0.08), 0 14px 34px rgba(0,0,0,0.45), inset 0 -6px 12px rgba(0,0,0,0.25), inset 0 6px 10px rgba(255,255,255,0.4);
    display:flex; align-items:center; justify-content:center;
    font-size:52px;
    user-select:none; -webkit-user-select:none;
    transition:transform .35s ease, box-shadow .45s ease;
  }
  .doorbell-btn::after{
    content:"";
    position:absolute; inset:-18px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(248,223,160,0.55) 0%, rgba(248,223,160,0) 70%);
    opacity:0;
    transition:opacity .5s ease;
    pointer-events:none;
    z-index:-1;
  }
  @keyframes doorbellBreathe{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.07); }
  }
  .doorbell-btn.holding{
    animation:doorbellBreathe 1.15s ease-in-out infinite;
    box-shadow:0 0 0 8px rgba(248,223,160,0.14), 0 14px 34px rgba(0,0,0,0.45), inset 0 -6px 12px rgba(0,0,0,0.25), inset 0 6px 10px rgba(255,255,255,0.4), 0 0 34px 10px rgba(248,223,160,0.6);
  }
  .doorbell-btn.holding::after{
    opacity:1;
  }

  .ring-pulse{
    position:absolute; inset:0; border-radius:50%;
    border:2px solid rgba(248,223,160,0.6);
    opacity:0; pointer-events:none;
  }
  .ring-pulse.animate{ animation:ringPulse 1s ease-out infinite; }
  @keyframes ringPulse{
    0%{ opacity:0.8; transform:scale(1); }
    100%{ opacity:0; transform:scale(1.6); }
  }
  .doorbell-hint{ font-size:12.5px; color:var(--text-faint); margin-top:2px; min-height:16px; }
  .progress-ring-track{
    position:absolute; inset:-14px; border-radius:50%;
    background:conic-gradient(var(--pink) calc(var(--p,0) * 1%), rgba(255,255,255,0.08) 0);
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
    mask:radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
    opacity:0; transition:opacity .2s ease;
    pointer-events:none;
  }
  .progress-ring-track.show{ opacity:1; }

  /* ---------- ANSWER PANEL ---------- */
  .answer-panel{
    width:100%; margin-top:auto;
    background:var(--bg-card);
    border-radius:var(--radius-lg) var(--radius-lg) 0 0;
    padding:22px 22px 26px 22px;
    box-shadow:0 -10px 30px rgba(0,0,0,0.4);
    transform:translateY(120%);
    transition:transform .35s cubic-bezier(.2,.9,.3,1.1);
  }
  .answer-panel.show{ transform:translateY(0); }
  .answer-panel .row-top{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;
  }
  .answer-panel .row-top .label{ font-size:14px; color:var(--text-dim); }
  .hint-toggle{
    width:24px; height:24px; border-radius:50%;
    background:rgba(255,255,255,0.08); color:var(--text-dim);
    font-size:13px; display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .hint-text{
    max-height:0; overflow:hidden; transition:max-height .35s ease, margin .35s ease;
    font-size:12px; color:var(--text-faint); line-height:1.7; white-space:pre-line;
  }
  .hint-text.show{ max-height:220px; margin-bottom:10px; }
  .answer-input-wrap{ position:relative; margin-bottom:14px; }
  .answer-input{
    width:100%; padding:14px 16px; border-radius:var(--radius-sm);
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12);
    color:var(--text-light); font-size:15px; margin-bottom:0;
    position:relative;
  }
  .answer-input:focus{ outline:none; border-color:var(--gold-2); }
  .answer-input.error-border{ border-color:#e05353 !important; }
  .answer-input.shake{ animation:inputShake 0.6s ease; }
  @keyframes inputShake{
    0%,100%{ transform:translateX(0); }
    15%{ transform:translateX(-8px); }
    30%{ transform:translateX(7px); }
    45%{ transform:translateX(-6px); }
    60%{ transform:translateX(4px); }
    75%{ transform:translateX(-2px); }
    90%{ transform:translateX(1px); }
  }
  .answer-input-msg{
    position:absolute; inset:0;
    display:flex; align-items:center;
    padding:0 16px;
    pointer-events:none;
    font-size:13.5px;
    font-weight:700;
    opacity:0;
    border-radius:var(--radius-sm);
    transition:opacity .25s ease;
  }
  .answer-input-msg.show{ opacity:1; }
  .answer-input-msg.warn-empty{ color:rgba(200,60,60,0.9); background:rgba(139,20,20,0.08); }
  .answer-input-msg.warn-close{ color:drgba(252, 248, 3, 0.881); background:rgba(0,0,0,0.04); }
  .answer-btns{ display:flex; gap:10px; }
  .answer-btns button{
    flex:1; padding:14px 0; border-radius:999px; font-size:14px; font-weight:700;
  }
  .btn-idk{ background:rgba(255,127,127,0.15); color:#ff9c9c; border:1px solid rgba(255,127,127,0.35) !important; }
  .btn-confirm{ background:linear-gradient(135deg,#5be6a8,#2fae7c); color:#0d2b1e; }
  /* 求助按钮：紫色调，和门铃/答对绿区分开，视觉上标记为"辅助类"操作 */
  .btn-help{
    background:rgba(180,122,255,0.16);
    color:#d3b8ff;
    border:1px solid rgba(180,122,255,0.45) !important;
  }
  .btn-help.hidden{ display:none !important; }

  /* ---------- FEEDBACK FLASH ---------- */
  #feedback-flash{
    position:fixed; inset:0; z-index:150;
    display:flex; align-items:center; justify-content:center;
    background:rgba(10,5,18,0.55);
    opacity:0; pointer-events:none;
  }
  #feedback-flash.show{ animation:flashIn .5s ease forwards; }
  @keyframes flashIn{
    0%{ opacity:0; }
    15%{ opacity:1; }
    85%{ opacity:1; }
    100%{ opacity:0; }
  }
  #feedback-flash .flash-text{
    font-size:26px; font-weight:700; padding:16px 30px; border-radius:20px;
    transform:scale(0.7);
  }
  #feedback-flash.correct .flash-text{
    color:#0d2b1e; background:linear-gradient(135deg,#8ff5c4,#4fd39a);
    animation:popIn .5s ease forwards;
    box-shadow:0 0 40px rgba(111,231,183,0.5);
  }
  #feedback-flash.wrong .flash-text{
    color:#e6e0f0; background:rgba(80,72,100,0.9);
    animation:popIn .5s ease forwards;
  }
  @keyframes popIn{ 0%{transform:scale(0.6); opacity:0;} 50%{transform:scale(1.06); opacity:1;} 100%{transform:scale(1); opacity:1;} }

  /* ---------- MODALS ---------- */
  .modal-overlay{
    position:fixed; inset:0; z-index:180;
    background:rgba(8,4,15,0.75);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  .modal-overlay.show{ opacity:1; pointer-events:auto; }
  .modal-box{
    width:90%; max-width:400px; background:var(--bg-card);
    border-radius:var(--radius-lg); overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
    transform:translateY(20px) scale(0.96); transition:transform .3s ease;
  }
  .modal-overlay.show .modal-box{ transform:translateY(0) scale(1); }

  /* -- info header (song metadata) -- */
  .modal-info-header{
    border-top:6px solid #b47aff;
    background:linear-gradient(160deg, #2d1a42 0%, #1f0f30 100%);
    padding:16px 20px;
  }
  .modal-info-title{
    font-size:16px; font-weight:700; margin-bottom:10px;
  }
  .modal-info-title.is-correct{ color:var(--success); }
  .modal-info-title.is-wrong{ color:var(--fail); }
  .modal-info-row{
    font-size:14.5px; color:#f0e6ff; line-height:1.8;
  }
  .modal-info-row b{ font-weight:500; }
  .modal-divider{ height:1px; background:rgba(255,255,255,0.1); }
  .modal-video-wrap{ padding:12px; }
  .modal-video-wrap video{ width:100%; display:block; background:#000; aspect-ratio:16/9; border-radius:12px; }
  .modal-box .modal-btn-wrap{ padding:4px 18px 20px 18px; }
  .modal-box .modal-btn-wrap button{
    width:100%; padding:14px 0; border-radius:999px; font-weight:700; font-size:15px;
  }
  .btn-collect{ background:linear-gradient(135deg,var(--gold-1),var(--gold-2)); color:#3b2604; }
  .btn-viewscore{ background:rgba(255,255,255,0.1); color:var(--text-light); border:1px solid rgba(255,255,255,0.15) !important; }

  /* ============================================================
     🆘 求助功能（原音重现 / 关键字提醒 / 相关信息提醒）
     ============================================================ */
  .help-overlay{
    position:fixed; inset:0; z-index:185;
    background:rgba(6,3,12,0.82);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  .help-overlay.show{ opacity:1; pointer-events:auto; }
  .help-box{
    width:100%; max-width:420px;

  function shuffle(arr){

  function getAnswerVariants(title){

  // 例如 "好好" -> ["好","好"]（2 张）；"Mojito" -> ["Mojito"]（1 张）；
  // "给我一首歌的时间" -> 8 张单字卡。
  function tokenizeTitleForCards(title){
    const tokens = [];
    const re = /[A-Za-z]+|[^\sA-Za-z]/g;
    let m;
    while((m = re.exec(title || ''))){
      tokens.push(m[0]);
    }
    return tokens;
  }

  // 🆕 计算两个字符串的"字符重叠数"（多重集合交集），用于判断玩家输入
  // 是否"很接近"正确答案：例如答案"消愁"，输入"消仇" -> 重叠 1 个字。
  function countCharOverlap(a, b){
    const freq = {};
    for(const ch of a){ freq[ch] = (freq[ch]||0) + 1; }
    let overlap = 0;
    for(const ch of b){
      if(freq[ch] > 0){ overlap++; freq[ch]--; }
    }
    return overlap;
  }
  // 只要命中任意一个可接受答案的"重叠比例 > 75%"，就算"很接近"
  function isCloseGuess(inputTrimmed, acceptedAnswers){
    return acceptedAnswers.some(ans => {
      if(!ans) return false;
      const overlap = countCharOverlap(inputTrimmed, ans);
      return overlap > ans.length * 0.75;
    });
  }

  // 🆕 星星汇入分数时的清脆音效：Web Audio 现场合成，不依赖外部音频文件。
  let audioCtx = null;
  function getAudioCtx(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(_){ audioCtx = null; }
    }
    return audioCtx;
  }
  // 6 颗星星对应的音高：逐级上扬的明亮音阶（大调五声音阶 + 高八度收尾）
  const STAR_CHIME_NOTES = [1046.5, 1174.7, 1318.5, 1567.98, 1760.0, 2093.0];
  function playStarChimeNote(index){
    const ctx = getAudioCtx();
    if(!ctx) return;
    const freq = STAR_CHIME_NOTES[Math.min(index, STAR_CHIME_NOTES.length - 1)];
    const t0 = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gainNode = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gainNode.gain.setValueAtTime(0, t0);
    gainNode.gain.linearRampToValueAtTime(0.28, t0 + 0.012);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
    osc.connect(gainNode).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.24);
  }
  // 收尾的明亮重音：一个明亮大三度和弦，代表本轮点数结算完成
  function playStarChimeAccent(){
    const ctx = getAudioCtx();
    if(!ctx) return;
    const t0 = ctx.currentTime;
    [2093.0, 2637.0].forEach((freq) => {
      const osc = ctx.createOscillator();
      const gainNode = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, t0);
      gainNode.gain.setValueAtTime(0, t0);
      gainNode.gain.linearRampToValueAtTime(0.32, t0 + 0.02);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
      osc.connect(gainNode).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.55);
    });
  }

  /* =====================================================
     组局：为本场游戏分配 12 道门的曲目
     - 严格遵守 allowedDoors：一首歌绝不会分配到不在它
       allowedDoors 列表里的门号。
     - 同一局游戏中，一首歌只会被选为一次"答案"（door.answer），
       已经被选为答案的歌会从后续门的候选池中排除。
     - 🆕 同一局游戏中，不会出现两首及以上"歌手完全相同"的歌
       （只对随机模式生效，每日挑战不受影响；且只在"普通模式"和
       "欧美专区"启用，K-pop 专区不启用——见 dedupArtists 参数）。
     ===================================================== */
  function buildGameDoors(pool, dedupArtists){
    const used = new Set(); // 已经被选为"答案"的歌曲 id（一局内不重复）
    const usedArtists = new Set(); // 🆕 已经出现过的歌手，一局内不重复
    const doors = {};

    function hasConflict(song){
      return (song.excludeWith||[]).some(exId => used.has(exId));
    }
    function artistTaken(song){
      return !!(dedupArtists && song.artist && usedArtists.has(song.artist));
    }

    for(let n=1;n<=12;n++){
      const count = Math.random() < 0.5 ? 3 : 4;

      // 第一优先：allowedDoors 命中 + 无互斥冲突 + 歌手未重复
      let candidates = shuffle(pool.filter(s => (s.allowedDoors||[]).includes(n) && !used.has(s.id) && !hasConflict(s) && !artistTaken(s)));

      // 兜底1：数量不够时，放宽"互斥冲突"，但"歌手不重复"依然坚持
      if(candidates.length < count){
        const relaxed = shuffle(pool.filter(s => (s.allowedDoors||[]).includes(n) && !used.has(s.id) && !artistTaken(s)));
        candidates = relaxed;
      }

      // 兜底2：万一曲库覆盖不够，"歌手不重复"这条会导致这扇门彻底无歌可选，
      // 这时才最后放宽这一条，保证游戏能进行下去，并打印警告方便你补充曲库
      if(candidates.length === 0){
        const lastResort = shuffle(pool.filter(s => (s.allowedDoors||[]).includes(n) && !used.has(s.id)));
        if(lastResort.length > 0){
          console.warn('[猜歌游戏] 门 ' + n + ' 为了保证有歌可用，暂时放宽了"同局不重复歌手"的限制，建议为这个门号补充覆盖更多歌手的歌曲。');
        }
        candidates = lastResort;
      }

      if(candidates.length === 0){
        console.warn('[猜歌游戏] 门 ' + n + ' 没有可用的（未使用过的）歌曲，请检查 SONG_DATABASE 的 allowedDoors 覆盖是否足够。');
      }

      let picked = candidates.slice(0, Math.min(count, candidates.length));
      const answer = picked.length ? picked[Math.floor(Math.random()*picked.length)] : null;
      if(answer){
        used.add(answer.id); // 只有真正被抽为"答案"的歌才标记为已用，避免同一首歌一局内出现两次
        if(answer.artist) usedArtists.add(answer.artist);
      }
      doors[n] = { num:n, songs:picked, answer, solved:false };
    }
    return doors;
  }

        cell.innerHTML = `<div class="flip-inner"><div class="emoji door-number-badge">${String(doorNum).padStart(2,'0')}</div></div>`;

        cell.innerHTML = `<div class="flip-inner"><div class="emoji">${z.emoji}</div><div class="name">${z.name}</div></div>`;
      }
      if(!solved){
        cell.addEventListener('click', () => openDoorFromAnimal(z.key));
      } else {
        cell.disabled = true;
      }
      grid.appendChild(cell);
    });
  }

  $('btn-back-home').addEventListener('click', () => {
    switchScreen('home');
  });

  function openDoorFromAnimal(animalKey){
    state.currentAnimalKey = animalKey;
    state.currentDoorNum = state.animalDoorMap[animalKey];
    const doorNum = state.currentDoorNum;

    $('door-number').textContent = String(doorNum).padStart(2,'0');
    $('door-score-hint').textContent = `答对可得 ${getScoreForDoor(doorNum).toLocaleString()} 分`;
    resetDoorUI();
    switchScreen('door', {portal:true});
  }

  $('btn-back-zodiac').addEventListener('click', () => {
    cleanupAudio();
    closeHelpOverlay();
    switchScreen('zodiac');
  });

  function resetDoorUI(){
    $('answer-panel').classList.remove('show');
    $('answer-input').value = '';
    $('hint-text').classList.remove('show');
    $('hint-text').textContent = RULE_HINT_TEXT;
    $('doorbell-hint').textContent = '长按门铃，聆听门后的旋律';
    $('doorbell-btn').classList.remove('holding');
    $('ring-pulse').classList.remove('animate');
    $('progress-ring').classList.remove('show');
    $('progress-ring').style.setProperty('--p', 0);
    state.answering = false;
    state.holdStart = 0;
    state.closeAttempts = 0; // 🆕 每扇新门重新计数
    clearInputWarning();
    closeHelpOverlay(); // 防御性重置：万一上一扇门求助面板没关就切了门
    updateHelpButtonVisibility();

    // 提前预加载这扇门后面的歌曲：进入门铃界面时就开始缓冲，
    // 减少长按门铃后到真正出声之间的延迟（移动端首次加载尤其明显）。
    const door = state.doors[state.currentDoorNum];
    if(door && door.answer){
      try{
        const preAudio = new Audio(door.answer.audio);
        preAudio.preload = 'auto';
        preAudio.load();
        state.preloadedAudio = preAudio;
        state.preloadedDoorNum = state.currentDoorNum;
      }catch(err){
        state.preloadedAudio = null;
        state.preloadedDoorNum = null;
      }
    } else {
      state.preloadedAudio = null;
      state.preloadedDoorNum = null;
    }
  }

  const doorbellBtn = $('doorbell-btn');
  const ringPulse = $('ring-pulse');
  const progressRing = $('progress-ring');
  const doorbellHint = $('doorbell-hint');

  function startHold(e){
    if(state.isHolding || state.answering) return;
    e.preventDefault();
    state.isHolding = true;
    state.holdStart = 0; // 真正的计时会在音频实际开始播放（'playing'事件）后才启动

    doorbellBtn.classList.add('holding');
    doorbellHint.textContent = '正在连接旋律…';

    const door = state.doors[state.currentDoorNum];
    const song = door.answer;

    function tick(){
      if(!state.isHolding || !state.holdStart) return;
      const elapsed = Date.now() - state.holdStart;
      const pct = Math.min(100, (elapsed / HOLD_MAX_MS) * 100);
      progressRing.style.setProperty('--p', pct.toFixed(1));
      if(elapsed >= HOLD_MAX_MS){
        endHold();
        return;
      }
      state.progressRAF = requestAnimationFrame(tick);
    }

    function beginCountingFromNow(){
      if(!state.isHolding) return; // 用户可能已经在音频真正响起之前松手了
      if(state.holdStart) return; // 避免重复触发
      state.holdStart = Date.now();
      ringPulse.classList.add('animate');
      progressRing.classList.add('show');
      doorbellHint.textContent = '正在聆听…松开结束';
      state.progressRAF = requestAnimationFrame(tick);
    }

    let audio = null;
    if(song){
      try{
        // 优先复用 resetDoorUI 里已经预加载好的音频对象，减少延迟
        if(state.preloadedAudio && state.preloadedDoorNum === state.currentDoorNum){
          audio = state.preloadedAudio;
        } else {
          audio = new Audio(song.audio);
          audio.preload = 'auto';
        }
        state.preloadedAudio = null;
        state.preloadedDoorNum = null;

        audio.volume = 1;
        audio.loop = false;
        audio.addEventListener('error', () => {
          console.warn('[猜歌游戏] 音频加载失败，请检查路径/文件是否存在：', song.audio);
        });
        audio.addEventListener('playing', () => {
          if(!state.isHolding){
            // 用户已经松手了，音频才姗姗来迟地开始播放——直接停掉，不再计时
            try{ audio.pause(); }catch(_){}
            return;
          }
          beginCountingFromNow();
        }, { once:true });
        audio.play().catch((err) => {
          console.warn('[猜歌游戏] 音频播放失败或被浏览器拦截：', song.audio, err);
        });
      }catch(err){
        console.warn('[猜歌游戏] 创建音频对象时出错：', song.audio, err);
        audio = null;
      }
    } else {
      console.warn('[猜歌游戏] 门 ' + state.currentDoorNum + ' 没有分配到歌曲（曲库 allowedDoors 配置不完整）。');
    }
    state.audio = audio;

    // 兜底：如果音频对象创建失败（没有 'playing' 事件可等），直接按下即开始计时，
    // 避免用户长按却永远等不到进度环出现。
    if(!audio){
      beginCountingFromNow();
    }
  }

  function endHold(){
    if(!state.isHolding) return;
    state.isHolding = false;
    doorbellBtn.classList.remove('holding');
    ringPulse.classList.remove('animate');
    doorbellHint.textContent = '旋律渐渐淡去…';
    if(state.progressRAF) cancelAnimationFrame(state.progressRAF);
    fadeOutAudio(() => {
      progressRing.classList.remove('show');
      showAnswerPanel();
    });
  }

  function fadeOutAudio(onDone){
    const audio = state.audio;
    if(!audio){ onDone && onDone(); return; }
    clearInterval(state.fadeTimer);
    const step = 0.06;
    state.fadeTimer = setInterval(() => {
      try{
        audio.volume = Math.max(0, audio.volume - step);
      }catch(err){
        clearInterval(state.fadeTimer);
        onDone && onDone();
        return;
      }
      if(audio.volume <= 0.001){
        clearInterval(state.fadeTimer);
        try{ audio.pause(); }catch(_){}
        onDone && onDone();
      }
    }, 45);
  }

  function cleanupAudio(){
    state.isHolding = false;
    if(state.progressRAF) cancelAnimationFrame(state.progressRAF);
    clearInterval(state.fadeTimer);
    if(state.audio){ try{ state.audio.pause(); }catch(_){} state.audio = null; }
    if(state.preloadedAudio){ try{ state.preloadedAudio.pause(); }catch(_){} state.preloadedAudio = null; }
    doorbellBtn.classList.remove('holding');
    ringPulse.classList.remove('animate');
    progressRing.classList.remove('show');
  }

  doorbellBtn.addEventListener('mousedown', startHold);
  doorbellBtn.addEventListener('touchstart', startHold, {passive:false});
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(evt=>{
    doorbellBtn.addEventListener(evt, endHold);
  });

  function showAnswerPanel(){
    state.answering = true;
    $('answer-panel').classList.add('show');
    updateHelpButtonVisibility();
    setTimeout(()=> $('answer-input').focus(), 200);
  }

  $('hint-toggle').addEventListener('click', () => {
    $('hint-text').classList.toggle('show');
  });

  /* ============================================================
     🆕 答案输入的校验反馈：抖动 + 框内提示文字
     ------------------------------------------------------------
     - 空输入：抖动 + 边框变红 + "你还未输入答案哦"
     - 非空但"很接近"（字符重叠 > 答案长度的 75%）：抖动 + "很接近了，再想想"，
       连续 3 次仍然是这种情况才判定为本扇门挑战失败。
     - 玩家只要开始重新输入（input 事件），警告状态立刻清除。
     ============================================================ */
  const answerInputEl = $('answer-input');
  const answerInputMsgEl = $('answer-input-msg');

  function clearInputWarning(){
    answerInputEl.classList.remove('error-border');
    answerInputMsgEl.className = 'answer-input-msg';
    answerInputMsgEl.textContent = '';
  }
  answerInputEl.addEventListener('input', clearInputWarning);

  function showInputWarning(message, { isEmpty = false } = {}){
    answerInputEl.classList.remove('shake');
    void answerInputEl.offsetWidth; // 重启抖动动画
    answerInputEl.classList.add('shake');
    if(isEmpty){
      answerInputEl.classList.add('error-border');
    }
    answerInputMsgEl.textContent = message;
    answerInputMsgEl.className = 'answer-input-msg show ' + (isEmpty ? 'warn-empty' : 'warn-close');
  }

  function handleConfirmClick(){
    if(!state.answering) return;
    const raw = answerInputEl.value;
    const trimmed = normalizeAnswer(raw);

    if(!trimmed){
      showInputWarning('你还未输入答案哦', { isEmpty:true });
      return;
    }

    const door = state.doors[state.currentDoorNum];
    if(door && door.answer){
      const acceptedAnswers = getAnswerVariants(door.answer.title);
      const exactCorrect = acceptedAnswers.includes(trimmed);
      if(!exactCorrect && isCloseGuess(trimmed, acceptedAnswers)){
        state.closeAttempts++;
        if(state.closeAttempts < 3){
          showInputWarning('很接近了，再想想', { isEmpty:false });
          return; // 还有机会，不提交，让玩家继续尝试
        }
        // 第三次仍然是"很接近但错误" —— 走正常提交流程，判定失败
      }
    }
    submitAnswer(raw);
  }

  $('btn-idk').addEventListener('click', () => submitAnswer(null));
  $('btn-confirm').addEventListener('click', handleConfirmClick);
  $('answer-input').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') handleConfirmClick();
  });

  function submitAnswer(rawValue){
    if(!state.answering) return;
    state.answering = false;
    $('answer-panel').classList.remove('show');
    closeHelpOverlay();

    const door = state.doors[state.currentDoorNum];
    if(!door.answer){
      setTimeout(() => showFeedback(false, door), 150);
      return;
    }
    const correctTitle = door.answer.title;
    const acceptedAnswers = getAnswerVariants(correctTitle);
    const isCorrect = rawValue !== null && acceptedAnswers.includes(normalizeAnswer(rawValue));

    setTimeout(() => showFeedback(isCorrect, door), 150);
  }

  /* ============================================================
     🆘 求助功能
     ------------------------------------------------------------
     - btn-help：本局用过一次后会被隐藏（updateHelpButtonVisibility）
     - 三选一里，玩家点了其中任意一个即视为"用掉"这次求助机会，
       和后面翻牌/播放的具体交互结果无关（哪怕求助后依然答错也不退还）。
     - 三种求助方式共用同一个 help-overlay 弹窗容器，只是显示不同的
       .help-step 子面板。
     ============================================================ */
  const helpOverlay = $('help-overlay');
  const helpBtn = $('btn-help');
  const helpStepChoose = $('help-step-choose');
  const helpStepAudio = $('help-step-audio');
  const helpStepKeyword = $('help-step-keyword');
  const helpStepInfo = $('help-step-info');
  const helpPlayerWrap = $('help-player-wrap');
  let helpAudioEl = null; // 原音重现用到的 <audio>，关闭求助时要一起销毁
  let helpFlipsUsed = 0;
  let helpMaxFlips = 0;

  function updateHelpButtonVisibility(){
    helpBtn.classList.toggle('hidden', state.helpUsedThisGame);
  }

  function openHelpOverlay(){
    // 每次打开都重置回"三选一"这一步，几个具体求助面板先隐藏、清空
    [helpStepAudio, helpStepKeyword, helpStepInfo].forEach(s => s.classList.add('hidden'));
    helpStepChoose.classList.remove('hidden');
    helpOverlay.classList.add('show');
  }

  function closeHelpOverlay(){
    helpOverlay.classList.remove('show');
    // 原音重现的音频播放要跟着一起停掉、销毁，避免残留播放
    if(helpAudioEl){
      try{ helpAudioEl.pause(); }catch(_){}
      helpAudioEl = null;
    }
    helpPlayerWrap.innerHTML = '';
  }

  helpBtn.addEventListener('click', () => {
    if(state.helpUsedThisGame) return; // 双重保险：本局已经用过就不响应
    openHelpOverlay();
  });

  document.querySelectorAll('.help-choice').forEach(btn=>{
    btn.addEventListener('click', () => {
      // 选中三选一中的任意一个，本局唯一一次求助机会即视为用掉
      state.helpUsedThisGame = true;
      updateHelpButtonVisibility();

      helpStepChoose.classList.add('hidden');
      const type = btn.dataset.help;
      if(type === 'audio') startAudioHelp();
      else if(type === 'keyword') startKeywordHelp();
      else if(type === 'info') startInfoHelp();
    });
  });

  // -- 原音重现 --
  function startAudioHelp(){
    helpStepAudio.classList.remove('hidden');
    const door = state.doors[state.currentDoorNum];
    const song = door ? door.answer : null;

    helpPlayerWrap.innerHTML = '';
    const titleEl = document.createElement('div');
    titleEl.className = 'help-player-title';
    titleEl.textContent = '🎵 正在播放原唱片段…';
    helpPlayerWrap.appendChild(titleEl);

    const audioEl = document.createElement('audio');
    audioEl.controls = true;
    audioEl.autoplay = true;
    // originalAudio 没配置时，退回播放门铃用的 audio 字段，保证功能始终可用
    audioEl.src = (song && (song.originalAudio || song.audio)) || '';
    helpPlayerWrap.appendChild(audioEl);
    helpAudioEl = audioEl;
    audioEl.play().catch(()=>{});

    $('help-exit-audio').classList.remove('hidden');
  }

  // -- 关键字提醒：翻牌，只能翻 1 张 --
  function startKeywordHelp(){
    helpStepKeyword.classList.remove('hidden');
    const door = state.doors[state.currentDoorNum];
    const song = door ? door.answer : null;
    const tokens = tokenizeTitleForCards(song ? getDisplayTitle(song.title) : '');

    helpMaxFlips = 1;
    helpFlipsUsed = 0;
    const grid = $('help-keyword-grid');
    grid.innerHTML = '';
    $('help-exit-keyword').classList.add('hidden');

    tokens.forEach((tok) => {
      const card = document.createElement('div');
      card.className = 'hint-card';
      card.innerHTML =
        '<div class="hint-card-inner">' +
          '<div class="hint-card-face hint-card-front">？</div>' +
          '<div class="hint-card-face hint-card-back"></div>' +
        '</div>';
      card.querySelector('.hint-card-back').textContent = tok;

      card.addEventListener('click', () => {
        if(card.classList.contains('flipped') || helpFlipsUsed >= helpMaxFlips) return;
        card.classList.add('flipped');
        helpFlipsUsed++;
        if(helpFlipsUsed >= helpMaxFlips){
          grid.querySelectorAll('.hint-card:not(.flipped)').forEach(c => c.classList.add('disabled'));
          $('help-exit-keyword').classList.remove('hidden');
        }
      });
      grid.appendChild(card);
    });
  }

  // -- 相关信息提醒：翻牌，最多翻 3 张（歌手 / 专辑 / 年代 / 风格） --
  function startInfoHelp(){
    helpStepInfo.classList.remove('hidden');
    const door = state.doors[state.currentDoorNum];
    const song = (door && door.answer) || {};

    helpMaxFlips = 3; // 相关信息提醒：最多可翻开三张卡
    helpFlipsUsed = 0;
    const grid = $('help-info-grid');
    grid.innerHTML = '';
    $('help-exit-info').classList.add('hidden');

    const items = [
      { front:'查看歌手',       back: song.artist || '暂无数据' },
      { front:'查看专辑名称',   back: song.album  || '暂无数据' },
      { front:'查看发行年代',   back: song.year   || '暂无数据' },
      { front:'查看歌曲主题风格', back: song.genre || '待补充' }
    ];

    items.forEach((item) => {
      const card = document.createElement('div');
      card.className = 'hint-card hint-card-wide';
      card.innerHTML =
        '<div class="hint-card-inner">' +
          '<div class="hint-card-face hint-card-front"></div>' +
          '<div class="hint-card-face hint-card-back"></div>' +
        '</div>';
      card.querySelector('.hint-card-front').textContent = item.front;
      card.querySelector('.hint-card-back').textContent = item.back;

      card.addEventListener('click', () => {
        if(card.classList.contains('flipped') || helpFlipsUsed >= helpMaxFlips) return;
        card.classList.add('flipped');
        helpFlipsUsed++;
        if(helpFlipsUsed >= helpMaxFlips){
          grid.querySelectorAll('.hint-card:not(.flipped)').forEach(c => c.classList.add('disabled'));
          $('help-exit-info').classList.remove('hidden');
        }
      });
      grid.appendChild(card);
    });
  }

  ['help-exit-audio','help-exit-keyword','help-exit-info'].forEach(id=>{
    $(id).addEventListener('click', closeHelpOverlay);
  });

  function showFeedback(isCorrect, door){
    const flash = $('feedback-flash');
    const text = $('flash-text');
    flash.className = '';
    flash.classList.add('show', isCorrect ? 'correct' : 'wrong');
    text.textContent = isCorrect ? '恭喜你回答正确！' : '很遗憾，挑战失败';

    setTimeout(() => {
      flash.classList.remove('show');
      openResultModal(isCorrect, door);
    }, 1250);
  }

  const resultModal = $('modal-result');
  const resultTitle = $('result-title');
  const resultInfoRows = $('result-info-rows');
  const btnCollect = $('btn-collect');
  const btnViewScore = $('btn-viewscore');
  const resultVideoWrap = $('modal-video-wrap');

  function createResultVideoEl(){
    resultVideoWrap.innerHTML = '';
    const v = document.createElement('video');
    v.id = 'result-video';
    v.playsInline = true;
    v.setAttribute('playsinline', '');
    v.setAttribute('webkit-playsinline', '');
    v.controls = true;
    v.autoplay = true;
    v.muted = true;
    v.disablePictureInPicture = true;
    v.setAttribute('disablepictureinpicture', '');
    v.setAttribute('controlsList', 'nodownload noremoteplayback nofullscreen');
    v.disableRemotePlayback = true;
    v.setAttribute('disableremoteplayback', '');
    v.setAttribute('x-webkit-airplay', 'deny');
    v.setAttribute('x5-video-player-type', 'h5');
    v.setAttribute('x5-playsinline', 'true');
    v.setAttribute('x5-video-player-fullscreen', 'false');
    v.setAttribute('x5-video-orientation', 'portraint');
    resultVideoWrap.appendChild(v);
    return v;
  }
  function destroyResultVideoEl(){
    resultVideoWrap.innerHTML = '';
  }
  document.addEventListener('visibilitychange', () => {
    if(!document.hidden) return;
    const v = document.getElementById('result-video');
    if(v){ try{ v.pause(); }catch(_){} }
  });
  window.addEventListener('pagehide', () => { destroyResultVideoEl(); });
  window.addEventListener('beforeunload', () => { destroyResultVideoEl(); });

  function openResultModal(isCorrect, door){
    const song = door.answer;
    const resultVideo = createResultVideoEl();

    resultTitle.className = 'modal-info-title ' + (isCorrect ? 'is-correct' : 'is-wrong');
    resultTitle.textContent = isCorrect ? '🎉 恭喜你回答正确！' : '😔 很遗憾，挑战失败';

    if(song){
      resultInfoRows.innerHTML = `
        🎵 歌名：${getDisplayTitle(song.title)}<br>
        🎤 歌手：${song.artist}<br>
        💿 专辑：${song.album}<br>
        📅 发行年份：${song.year}
      `;
      resultVideo.src = song.video;
    } else {
      resultInfoRows.innerHTML = `⚠️ 这扇门未配置歌曲，请检查曲库设置。`;
    }

    btnCollect.classList.toggle('hidden', !isCorrect);
    btnViewScore.classList.toggle('hidden', isCorrect);
    resultModal.dataset.correct = isCorrect ? '1':'0';
    resultModal.dataset.door = door.num;
    resultModal.classList.add('show');
    if(song){
      resultVideo.currentTime = 0;
      resultVideo.play().catch(()=>{});
    }
  }

  function closeResultModal(){
    resultModal.classList.remove('show');
    destroyResultVideoEl();
  }

  btnCollect.addEventListener('click', () => {
    const doorNum = Number(resultModal.dataset.door);
    closeResultModal();
    collectStarsThenContinue(doorNum);
  });

  btnViewScore.addEventListener('click', () => {
    closeResultModal();
    goToSummary();
  });

  function collectStarsThenContinue(doorNum){
    const gained = getScoreForDoor(doorNum);
    const target = $('score-pill-door');
    const targetRect = target.getBoundingClientRect();
    const originX = window.innerWidth/2;
    const originY = window.innerHeight/2;

    const starCount = 6;
    let arrived = 0;
    for(let i=0;i<starCount;i++){
      const star = document.createElement('div');
      star.className = 'fly-star';
      star.textContent = '⭐';
      star.style.left = (originX + (Math.random()*60-30)) + 'px';
      star.style.top = (originY + (Math.random()*40-20)) + 'px';
      document.body.appendChild(star);

      const dx = (targetRect.left + targetRect.width/2) - originX;
      const dy = (targetRect.top + targetRect.height/2) - originY;
      const delay = i * 90;

      setTimeout(() => {
        star.style.transition = 'transform .6s cubic-bezier(.2,.8,.3,1), opacity .6s ease';
        requestAnimationFrame(()=>{
          star.style.transform = `translate(${dx}px, ${dy}px) scale(0.3)`;
          star.style.opacity = '0.2';
        });
        setTimeout(() => {
          star.remove();
          arrived++;
          bumpScorePill('door');
          playStarChimeNote(i); // 🆕 每颗星星落定，播放一个逐级上扬的音符
          if(arrived === starCount){
            finishScoreCount(doorNum, gained);
          }
        }, 620);
      }, delay);
    }
  }

  function finishScoreCount(doorNum, gained){
    const start = state.score;
    const end = start + gained;
    const duration = 500;
    const t0 = performance.now();
    function step(t){
      const p = Math.min(1, (t - t0)/duration);
      state.score = Math.round(start + (end-start)*p);
      syncScoreDisplays();
      if(p < 1) requestAnimationFrame(step);
      else {
        state.score = end;
        syncScoreDisplays();
        playStarChimeAccent(); // 🆕 本轮点数结算完成，收尾一声明亮重音
        markDoorSolvedAndContinue(doorNum);
      }
    }
    requestAnimationFrame(step);
  }

  function markDoorSolvedAndContinue(doorNum){
    state.doors[doorNum].solved = true;
    state.solvedAnimals.add(state.currentAnimalKey);

    if(state.solvedAnimals.size >= 12){
      goToSummary();
      return;
    }
    renderZodiacGrid();
    switchScreen('zodiac', {portal:true});
  }

  function goToSummary(){
    $('summary-total').textContent = state.score.toLocaleString();
    const starCount = state.score >= 60000 ? 3 : state.score >= 20000 ? 2 : 1;
    $('summary-stars').textContent = '⭐'.repeat(starCount);
    if(state.mode === 'daily'){
      setLastDailyScore(state.score); // 🆕 记录本局每日挑战积分，供首页展示
    }
    switchScreen('summary', {portal:true});
  }

  $('btn-return-home').addEventListener('click', () => {
    cleanupAudio();
    closeHelpOverlay();
    state.mode = null;
    state.score = 0;
    state.doors = {};
    state.animalDoorMap = {};
    state.solvedAnimals = new Set();
    state.currentAnimalKey = null;
    state.currentDoorNum = null;
    refreshDailyBannerScore(); // 🆕 回到首页时刷新一次每日挑战的上一局积分显示
    switchScreen('home', {portal:true});
  });

})();
</script>
</body>
</html>
